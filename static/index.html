<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportHers</title>
    <link rel="icon" href="/static/supporthers.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=DM+Serif+Display&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #faf8f5;
            --surface: #fff;
            --copper: #c4856a;
            --copper-light: #e8cfc3;
            --copper-dark: #9c6550;
            --ink: #2c2421;
            --ink-light: #6b5e58;
            --ink-muted: #a89992;
            --border: #e8e2dc;
            --border-light: #f0ece8;
            --serif: 'DM Serif Display', Georgia, serif;
            --sans: 'DM Sans', -apple-system, system-ui, sans-serif;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Nav ─────────────────────────────── */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }
        .nav-brand img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }
        .nav-brand span {
            font-family: var(--serif);
            font-size: 1.25rem;
            color: var(--ink);
        }
        .nav-settings {
            font-size: 0.82rem;
            color: var(--ink-muted);
            background: none;
            border: 1px solid var(--border);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--sans);
            transition: border-color 0.2s, color 0.2s;
        }
        .nav-settings:hover { border-color: var(--copper); color: var(--ink-light); }

        /* ── Hero ────────────────────────────── */
        .hero {
            max-width: 640px;
            margin: 0 auto;
            padding: 4rem 2rem 2rem;
            text-align: center;
        }
        .hero h1 {
            font-family: var(--serif);
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 400;
            line-height: 1.2;
            color: var(--ink);
        }
        .hero h1 em {
            color: var(--copper);
            font-style: italic;
        }
        .hero p {
            margin-top: 1rem;
            font-size: 1rem;
            color: var(--ink-muted);
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 300;
        }

        /* ── Stages ──────────────────────────── */
        .stages {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        .stages-label {
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-muted);
            margin-bottom: 0.75rem;
        }
        .stages-row {
            display: flex;
            gap: 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--surface);
        }
        .stage-btn {
            flex: 1;
            padding: 1rem 0.5rem;
            background: none;
            border: none;
            border-right: 1px solid var(--border);
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            font-family: var(--sans);
        }
        .stage-btn:last-child { border-right: none; }
        .stage-btn:hover { background: var(--border-light); }
        .stage-btn.active {
            background: var(--copper);
        }
        .stage-btn.active .stage-btn-label,
        .stage-btn.active .stage-btn-age { color: #fff; }
        .stage-btn-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--ink);
            line-height: 1.3;
        }
        .stage-btn-age {
            display: block;
            font-size: 0.72rem;
            color: var(--ink-muted);
            margin-top: 0.15rem;
        }

        /* ── Stage detail ────────────────────── */
        .stage-detail {
            display: none;
            max-width: 800px;
            margin: 1rem auto 0;
            padding: 0 2rem;
        }
        .stage-detail.visible { display: block; }
        .stage-detail-inner {
            padding: 1.25rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
        }
        .stage-detail-desc {
            font-size: 0.9rem;
            color: var(--ink-light);
            font-weight: 300;
        }
        .stage-detail-topics {
            margin-top: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .topic-btn {
            font-size: 0.78rem;
            font-family: var(--sans);
            padding: 0.3rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--bg);
            color: var(--ink-light);
            cursor: pointer;
            transition: all 0.15s;
        }
        .topic-btn:hover {
            border-color: var(--copper);
            color: var(--copper-dark);
        }

        /* ── Input area ──────────────────────── */
        .input-area {
            max-width: 800px;
            margin: 2rem auto 0;
            padding: 0 2rem;
        }
        .input-box {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .input-box:focus-within { border-color: var(--copper); }
        .input-box textarea {
            width: 100%;
            border: none;
            padding: 1.25rem 1.5rem 0.75rem;
            font-family: var(--sans);
            font-size: 0.95rem;
            color: var(--ink);
            resize: none;
            min-height: 88px;
            background: transparent;
            line-height: 1.6;
        }
        .input-box textarea:focus { outline: none; }
        .input-box textarea::placeholder { color: var(--ink-muted); }
        .input-actions {
            display: flex;
            justify-content: flex-end;
            padding: 0.5rem 1rem 1rem;
        }
        .submit-btn {
            padding: 0.55rem 1.5rem;
            background: var(--copper);
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: var(--sans);
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        .submit-btn:hover:not(:disabled) { background: var(--copper-dark); }
        .submit-btn:disabled { opacity: 0.35; cursor: default; }

        /* ── Settings drawer ─────────────────── */
        .settings-drawer {
            display: none;
            max-width: 800px;
            margin: 0.75rem auto 0;
            padding: 0 2rem;
        }
        .settings-drawer.open { display: block; }
        .settings-inner {
            padding: 1.25rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 600px) {
            .settings-inner { grid-template-columns: 1fr; }
            .stages-row { flex-wrap: wrap; }
            .stage-btn { flex: 1 1 calc(50% - 1px); border-bottom: 1px solid var(--border); }
        }
        .setting-col-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--copper);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .field { margin-bottom: 0.6rem; }
        .field label {
            display: block;
            font-size: 0.75rem;
            color: var(--ink-muted);
            margin-bottom: 0.2rem;
        }
        .field select, .field input[type="text"] {
            width: 100%;
            padding: 0.45rem 0.65rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: var(--sans);
            font-size: 0.82rem;
            color: var(--ink);
            background: var(--bg);
        }
        .field select:focus, .field input[type="text"]:focus {
            outline: none;
            border-color: var(--copper);
        }

        /* ── Loading ─────────────────────────── */
        .loading {
            display: none;
            max-width: 800px;
            margin: 2.5rem auto;
            padding: 0 2rem;
            text-align: center;
        }
        .loading.active { display: block; }
        .loading-bar {
            height: 2px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .loading-bar-fill {
            height: 100%;
            width: 30%;
            background: var(--copper);
            border-radius: 2px;
            animation: slide 1.5s ease-in-out infinite;
        }
        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }
        .loading-text {
            font-size: 0.85rem;
            color: var(--ink-muted);
            font-weight: 300;
        }

        /* ── Results ─────────────────────────── */
        .results {
            display: none;
            max-width: 800px;
            margin: 2.5rem auto 4rem;
            padding: 0 2rem;
        }
        .results.visible { display: block; }

        .results-header {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        .results-header h2 {
            font-family: var(--serif);
            font-size: 1.5rem;
            font-weight: 400;
        }
        .results-header .results-stage {
            font-size: 0.78rem;
            color: var(--copper);
            font-weight: 500;
        }

        .analysis {
            margin-bottom: 2rem;
            font-size: 0.95rem;
            color: var(--ink-light);
            line-height: 1.75;
            font-weight: 300;
        }

        .perspectives-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-muted);
            margin-bottom: 1rem;
        }

        .perspective {
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
        }
        .perspective-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 0.3rem;
        }
        .perspective-type {
            font-family: var(--serif);
            font-size: 1.05rem;
        }
        .perspective-num {
            font-size: 0.72rem;
            color: var(--ink-muted);
            font-variant-numeric: tabular-nums;
        }
        .perspective-brief {
            font-size: 0.8rem;
            color: var(--ink-muted);
            font-style: italic;
            margin-bottom: 1rem;
            font-weight: 300;
        }
        .perspective-content {
            font-size: 0.92rem;
            color: var(--ink-light);
            line-height: 1.75;
            white-space: pre-wrap;
            font-weight: 300;
        }

        .disclaimer {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.78rem;
            color: var(--ink-muted);
            text-align: center;
            font-weight: 300;
        }

        /* ── Error ───────────────────────────── */
        .error-box {
            display: none;
            max-width: 800px;
            margin: 1.5rem auto;
            padding: 0 2rem;
        }
        .error-box.visible { display: block; }
        .error-inner {
            padding: 0.9rem 1.25rem;
            border: 1px solid #e5c7c0;
            border-radius: 8px;
            background: #fdf5f3;
            color: var(--copper-dark);
            font-size: 0.88rem;
        }

        /* ── Footer ──────────────────────────── */
        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.78rem;
            color: var(--ink-muted);
            border-top: 1px solid var(--border);
            font-weight: 300;
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-brand">
        <img src="/static/supporthers.png" alt="SupportHers">
        <span>SupportHers</span>
    </div>
    <button class="nav-settings" id="settingsToggle">Settings</button>
</nav>

<div class="hero">
    <h1>Wellness guidance for <em>every stage</em> of your life</h1>
    <p>Multi-perspective AI insights from specialist viewpoints, tailored to where you are right now.</p>
</div>

<div class="stages">
    <div class="stages-label">Life stage</div>
    <div class="stages-row" id="stagesRow"></div>
</div>

<div class="stage-detail" id="stageDetail">
    <div class="stage-detail-inner">
        <div class="stage-detail-desc" id="stageDesc"></div>
        <div class="stage-detail-topics" id="stageTopics"></div>
    </div>
</div>

<div class="settings-drawer" id="settingsDrawer">
    <div class="settings-inner">
        <div>
            <div class="setting-col-label">Orchestrator</div>
            <div class="field">
                <label>Provider</label>
                <select id="orchProvider"></select>
            </div>
            <div class="field">
                <label>Model</label>
                <input type="text" id="orchModel">
            </div>
        </div>
        <div>
            <div class="setting-col-label">Workers</div>
            <div class="field">
                <label>Provider</label>
                <select id="workerProvider"></select>
            </div>
            <div class="field">
                <label>Model</label>
                <input type="text" id="workerModel">
            </div>
        </div>
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea id="questionInput" placeholder="What would you like guidance on?" rows="3"></textarea>
        <div class="input-actions">
            <button class="submit-btn" id="submitBtn" disabled>Ask</button>
        </div>
    </div>
</div>

<div class="loading" id="loading">
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    <div class="loading-text">Gathering specialist perspectives...</div>
</div>

<div class="error-box" id="errorBox"><div class="error-inner" id="errorText"></div></div>

<div class="results" id="results"></div>

<footer>
    SupportHers &mdash; AI-generated wellness information, not medical advice.
</footer>

<script>
(function() {
    let selectedStage = null;
    let stages = [];
    let providers = [];

    const $ = id => document.getElementById(id);

    async function init() {
        const [s, p] = await Promise.all([
            fetch('/api/life-stages').then(r => r.json()),
            fetch('/api/providers').then(r => r.json()),
        ]);
        stages = s;
        providers = p;
        renderStages();
        renderProviders();
    }

    function renderStages() {
        $('stagesRow').innerHTML = stages.map(s =>
            `<button class="stage-btn" data-key="${s.key}">
                <span class="stage-btn-label">${s.label}</span>
                <span class="stage-btn-age">${s.age_range}</span>
            </button>`
        ).join('');

        $('stagesRow').querySelectorAll('.stage-btn').forEach(btn => {
            btn.addEventListener('click', () => selectStage(btn.dataset.key));
        });
    }

    function selectStage(key) {
        selectedStage = key;
        document.querySelectorAll('.stage-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.key === key)
        );
        const s = stages.find(x => x.key === key);
        if (!s) return;

        $('stageDesc').textContent = s.description;
        $('stageTopics').innerHTML = s.example_topics.map(t =>
            `<button class="topic-btn">${esc(t)}</button>`
        ).join('');
        $('stageTopics').querySelectorAll('.topic-btn').forEach(b => {
            b.addEventListener('click', () => {
                $('questionInput').value = b.textContent;
                updateBtn();
                $('questionInput').focus();
            });
        });
        $('stageDetail').classList.add('visible');
        updateBtn();
    }

    function renderProviders() {
        if (!providers.length) return;
        const opts = providers.map(p =>
            `<option value="${p.key}" data-model="${p.default_model}">${p.label}</option>`
        ).join('');
        $('orchProvider').innerHTML = opts;
        $('workerProvider').innerHTML = opts;
        $('orchModel').value = providers[0].default_model;
        $('workerModel').value = providers[0].default_model;

        $('orchProvider').addEventListener('change', function() {
            const p = providers.find(x => x.key === this.value);
            if (p) $('orchModel').value = p.default_model;
        });
        $('workerProvider').addEventListener('change', function() {
            const p = providers.find(x => x.key === this.value);
            if (p) $('workerModel').value = p.default_model;
        });
    }

    $('settingsToggle').addEventListener('click', () =>
        $('settingsDrawer').classList.toggle('open')
    );

    function updateBtn() {
        $('submitBtn').disabled = !selectedStage || !$('questionInput').value.trim();
    }
    $('questionInput').addEventListener('input', updateBtn);

    $('submitBtn').addEventListener('click', submit);
    $('questionInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !$('submitBtn').disabled) submit();
    });

    async function submit() {
        const q = $('questionInput').value.trim();
        if (!q || !selectedStage) return;

        $('loading').classList.add('active');
        $('results').classList.remove('visible');
        $('errorBox').classList.remove('visible');
        $('submitBtn').disabled = true;

        try {
            const res = await fetch('/api/consult', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: q,
                    life_stage: selectedStage,
                    orchestrator_provider: $('orchProvider').value,
                    worker_provider: $('workerProvider').value,
                    orchestrator_model: $('orchModel').value || null,
                    worker_model: $('workerModel').value || null,
                }),
            });
            if (!res.ok) throw new Error(`Server error (${res.status})`);
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            renderResults(data);
        } catch (err) {
            $('errorText').textContent = err.message;
            $('errorBox').classList.add('visible');
        } finally {
            $('loading').classList.remove('active');
            updateBtn();
        }
    }

    function renderResults(data) {
        const stage = stages.find(s => s.key === selectedStage);
        let html = `
            <div class="results-header">
                <h2>Your Wellness Insights</h2>
                <span class="results-stage">${esc(stage?.label || '')}</span>
            </div>
        `;

        if (data.analysis) {
            html += `<div class="analysis">${esc(data.analysis)}</div>`;
        }

        if (data.worker_results?.length) {
            html += `<div class="perspectives-label">Specialist perspectives</div>`;
            data.worker_results.forEach((wr, i) => {
                const title = wr.type.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                html += `
                    <div class="perspective">
                        <div class="perspective-header">
                            <span class="perspective-type">${esc(title)}</span>
                            <span class="perspective-num">${i + 1} / ${data.worker_results.length}</span>
                        </div>
                        <div class="perspective-brief">${esc(wr.description)}</div>
                        <div class="perspective-content">${esc(wr.result)}</div>
                    </div>
                `;
            });
        }

        html += `<div class="disclaimer">This is AI-generated wellness information, not medical advice. Always consult a qualified healthcare professional.</div>`;

        $('results').innerHTML = html;
        $('results').classList.add('visible');
        $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
    }

    init();
})();
</script>
</body>
</html>
